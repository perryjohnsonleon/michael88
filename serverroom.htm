<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="content-type" content="text/html;charset=utf-8" />
<title>機房環控系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E12;
    --panel:#121821;
    --panel-2:#171F2A;
    --border:#232D3A;
    --text:#E7EDF3;
    --text-dim:#8FA0B3;
    --temp:#FF8A5B;
    --temp-dim:rgba(255,138,91,.16);
    --hum:#4FC3E8;
    --hum-dim:rgba(79,195,232,.16);
    --danger:#FF4757;
    --danger-dim:rgba(255,71,87,.14);
    --ok:#37E6B0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(79,195,232,.06), transparent 60%),
      radial-gradient(ellipse 900px 500px at 90% 10%, rgba(255,138,91,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    min-height:100vh;
    padding:20px 20px 60px;
  }
  .display{font-family:'Space Grotesk', ui-sans-serif, sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible{
    outline:2px solid var(--hum); outline-offset:2px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; gap:16px;
    max-width:1180px; margin:0 auto 18px;
    padding:14px 18px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    flex-wrap:wrap;
  }
  .home-btn{
    display:flex; align-items:center; justify-content:center;
    width:42px; height:42px; flex:0 0 auto;
    border-radius:10px; border:1px solid var(--border);
    background:var(--panel-2); text-decoration:none;
    transition:border-color .15s, transform .15s;
  }
  .home-btn:hover{border-color:var(--hum); transform:translateY(-1px);}
  .home-btn svg{width:20px;height:20px;stroke:var(--text);}

  .title-block{flex:1 1 220px; min-width:180px;}
  .title-block h1{margin:0; font-size:19px; letter-spacing:.02em; font-weight:700;}
  .title-block h1 span{color:var(--hum); font-weight:600;}
  .subtitle{font-size:11px; color:var(--text-dim); margin-top:2px; letter-spacing:.04em;}
  .clock{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .clock b{color:var(--ok);}

  .header-actions{display:flex; gap:10px; flex-wrap:wrap; margin-left:auto;}
  .explicit-btn, .chime-btn{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--panel-2);
    color:var(--text); font-size:12.5px; font-weight:600; letter-spacing:.02em;
    transition:border-color .15s, background .15s;
  }
  .explicit-btn:hover{border-color:var(--hum);}
  .chime-btn{border-color:var(--ok); color:var(--ok);}
  .chime-btn.off{border-color:var(--danger); color:var(--danger);}

  /* ---------- Alert settings panel ---------- */
  .alert-panel{
    max-width:1180px; margin:0 auto 18px;
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px 20px;
  }
  .alert-panel.hidden{display:none;}
  .alert-panel h2{margin:0 0 4px; font-size:15px; display:flex; align-items:center; gap:8px;}
  .alert-panel > p{margin:0 0 16px; font-size:11.5px; color:var(--text-dim); line-height:1.5;}
  .alert-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .alert-config{border:1px solid var(--border); border-radius:12px; padding:14px 16px; background:var(--panel-2);}
  .alert-config[data-kind="temperature"]{border-top:3px solid var(--temp);}
  .alert-config[data-kind="humidity"]{border-top:3px solid var(--hum);}
  .alert-config h3{margin:0 0 12px; font-size:13px; display:flex; align-items:center; justify-content:space-between;}
  .field-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-size:12px;}
  .field-row label{color:var(--text-dim);}
  .field-row select, .field-row input[type="number"]{
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:7px; padding:6px 8px; font-family:inherit; font-size:12px; width:120px;
  }
  .toggle-switch{position:relative; width:38px; height:20px; flex:0 0 auto;}
  .toggle-switch input{opacity:0; width:0; height:0;}
  .toggle-slider{position:absolute; inset:0; background:var(--border); border-radius:999px; cursor:pointer; transition:background .15s;}
  .toggle-slider::before{content:""; position:absolute; width:14px; height:14px; left:3px; top:3px; background:var(--text); border-radius:50%; transition:transform .15s;}
  .toggle-switch input:checked + .toggle-slider{background:var(--ok);}
  .toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px); background:#08130F;}
  .panel-footer{display:flex; justify-content:flex-end; margin-top:14px;}
  #closePanel{padding:9px 18px; border-radius:9px; border:1px solid var(--hum); background:var(--hum-dim); color:var(--hum); font-weight:600; font-size:12px;}

  /* ---------- Combined dashboard card ---------- */
  .dashboard-grid{max-width:1180px; margin:0 auto;}
  .metric-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; position:relative; overflow:hidden;
    transition:box-shadow .2s, border-color .2s;
  }
  .metric-card.alerting{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger), 0 0 26px rgba(255,71,87,.25);}

  .card-head{display:flex; gap:26px; flex-wrap:wrap; margin-bottom:12px;}
  .legend-item{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .legend-item .dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:2px;}
  .legend-item.temp .dot{background:var(--temp); box-shadow:0 0 8px var(--temp);}
  .legend-item.hum .dot{background:var(--hum); box-shadow:0 0 8px var(--hum);}
  .legend-name{font-size:11.5px; letter-spacing:.1em; color:var(--text-dim); font-weight:600;}
  .legend-value{font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:700; line-height:1;}
  .legend-value .unit{font-size:13px; color:var(--text-dim); margin-left:2px; font-weight:500;}
  .status-pill{
    font-size:10px; letter-spacing:.06em; font-weight:700;
    padding:3px 8px; border-radius:999px; border:1px solid var(--ok); color:var(--ok);
  }
  .status-pill.alert{border-color:var(--danger); color:var(--danger); animation:pulse 1.1s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ .status-pill.alert{animation:none;} }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  canvas{width:100%; height:300px; display:block; border-radius:10px; background:#0A0D11;}
  .axis-caption{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-top:6px;}
  .axis-caption .left{color:var(--temp);}
  .axis-caption .right{color:var(--hum);}

  .gauge-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:16px;}
  .gauge-wrap{}
  .gauge-label-row{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); margin-bottom:6px; letter-spacing:.04em;}
  .gauge-label-row b{color:var(--text);}
  .gauge-track{position:relative; height:12px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); overflow:hidden;}
  .gauge-fill{height:100%; width:0%; border-radius:999px; transition:width .4s ease;}
  .gauge-wrap[data-kind="temperature"] .gauge-fill{background:linear-gradient(90deg, var(--temp), var(--danger));}
  .gauge-wrap[data-kind="humidity"] .gauge-fill{background:linear-gradient(90deg, var(--hum), var(--danger));}
  .gauge-meta{display:flex; justify-content:space-between; font-size:10px; color:var(--text-dim); margin-top:5px;}

  footer{max-width:1180px; margin:22px auto 0; font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.6;}

  @media (max-width:880px){
    .alert-grid, .gauge-grid{grid-template-columns:1fr;}
    header{gap:10px;}
    .header-actions{width:100%; justify-content:flex-start;}
    .legend-value{font-size:22px;}
    canvas{height:260px;}
  }
</style>
</head>
<body>

<header>
  <a class="home-btn" href="/" title="Return to home page" aria-label="Return to home page">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4.5v-6h2v6H16.5a1 1 0 0 0 1-1v-9"/>
    </svg>
  </a>
  <div class="title-block">
    <h1 class="display">電腦機房<span>環控系統</span></h1>
    <div class="subtitle">伺服器區 — 冷通道 / 機櫃A </div>
    <div class="clock">台灣時間 <b id="clockText">--:--:--</b></div>
  </div>
  <div class="header-actions">
    <button id="alertSettingsBtn" class="explicit-btn">⚙ 溫濕度警示設定</button>
    <button id="chimeToggleBtn" class="chime-btn">🔔 警鈴開啟</button>
  </div>
</header>

<section id="alertPanel" class="alert-panel hidden" aria-label="Degrees alert settings">
  <h2 class="display">🔧 溫濕度警示設定</h2>
  <p>選擇溫濕度升降方向及響鈴聲調，儲存設定後立即生效。</p>
  <div class="alert-grid">

    <div class="alert-config" data-kind="temperature">
      <h3><span>🌡 溫度</span>
        <label class="toggle-switch">
          <input type="checkbox" id="temperature-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </h3>
      <div class="field-row"><label for="temperature-direction">Expected direction</label>
        <select id="temperature-direction"><option value="rising">升 ▲</option><option value="falling">降 ▼</option></select>
      </div>
      <div class="field-row"><label for="temperature-target">警示值 (°C)</label>
        <input type="number" id="temperature-target" step="0.1" value="28">
      </div>
      <div class="field-row"><label for="temperature-wave">響鈴聲調</label>
        <select id="temperature-wave">
          <option value="sine">Sine — soft</option>
          <option value="triangle">Triangle — mellow</option>
          <option value="square">Square — sharp</option>
          <option value="sawtooth">Sawtooth — buzzy</option>
        </select>
      </div>
      <div class="field-row"><label for="temperature-duration">鈴響持續時間 (分)</label>
        <input type="number" id="temperature-duration" min="1" max="30" value="3">
      </div>
    </div>

    <div class="alert-config" data-kind="humidity">
      <h3><span>💧 濕度</span>
        <label class="toggle-switch">
          <input type="checkbox" id="humidity-enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </h3>
      <div class="field-row"><label for="humidity-direction">升降方向</label>
        <select id="humidity-direction"><option value="rising">升 ▲</option><option value="falling">降 ▼</option></select>
      </div>
      <div class="field-row"><label for="humidity-target">警示值 (%RH)</label>
        <input type="number" id="humidity-target" step="0.1" value="65">
      </div>
      <div class="field-row"><label for="humidity-wave">響鈴聲調</label>
        <select id="humidity-wave">
          <option value="triangle" selected>Triangle — mellow</option>
          <option value="sine">Sine — soft</option>
          <option value="square">Square — sharp</option>
          <option value="sawtooth">Sawtooth — buzzy</option>
        </select>
      </div>
      <div class="field-row"><label for="humidity-duration">鈴響持續時間 (分)</label>
        <input type="number" id="humidity-duration" min="1" max="30" value="3">
      </div>
    </div>

  </div>
  <div class="panel-footer"><button id="closePanel">儲存</button></div>
</section>

<main class="dashboard-grid">
  <section class="metric-card" id="combinedCard">
    <div class="card-head">
      <div class="legend-item temp">
        <span class="dot"></span>
        <span class="legend-name">溫度</span>
        <span class="legend-value"><span id="temperature-value">--</span><span class="unit">°C</span></span>
        <span class="status-pill" id="temperature-status">NORMAL</span>
      </div>
      <div class="legend-item hum">
        <span class="dot"></span>
        <span class="legend-name">濕度</span>
        <span class="legend-value"><span id="humidity-value">--</span><span class="unit">%RH</span></span>
        <span class="status-pill" id="humidity-status">NORMAL</span>
      </div>
    </div>

    <canvas id="combined-canvas"></canvas>
    <div class="axis-caption"><span class="left">◀ 溫度 °C (左側縱軸)</span><span class="right">濕度 %RH (右側縱軸) ▶</span></div>

    <div class="gauge-grid">
      <div class="gauge-wrap" data-kind="temperature">
        <div class="gauge-label-row"><span>溫度到達警示值的進度</span><b id="temperature-gauge-text">0%</b></div>
        <div class="gauge-track"><div class="gauge-fill" id="temperature-gauge-fill"></div></div>
        <div class="gauge-meta"><span id="temperature-base-label">00:00 基準溫度 —</span><span id="temperature-target-label">警示值 —</span></div>
      </div>
      <div class="gauge-wrap" data-kind="humidity">
        <div class="gauge-label-row"><span>濕度到達警示值的進度</span><b id="humidity-gauge-text">0%</b></div>
        <div class="gauge-track"><div class="gauge-fill" id="humidity-gauge-fill"></div></div>
        <div class="gauge-meta"><span id="humidity-base-label">00:00 基準溫度 —</span><span id="humidity-target-label">警示值 —</span></div>
      </div>
    </div>
  </section>
</main>

<footer>
  實線代表即時軌跡（橘色代表溫度，青色代表濕度）。虛線標記每個指標的 00:00:00 基準；點線標記每個指標的警報目標值，分別位於各自的座標軸上。
</footer>

<script>
(function(){
  "use strict";

  /* ============ Audio: chimebell ============ */
  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // distinct chord per metric so simultaneous alerts are tellable apart by ear
  const CHORDS = {
    temperature: [523.25, 659.25, 783.99, 1046.50], // C5 E5 G5 C6 (bright, alerts about heat)
    humidity:    [392.00, 493.88, 587.33, 783.99]   // G4 B4 D5 G5 (lower, alerts about moisture)
  };

  // Plays one chimebell pattern for `kind`, using that metric's configured
  // oscillator waveform (osc.type). Every node created is pushed into
  // `sink` so an in-progress ring can be stopped immediately on demand.
  function playChime(kind, times, sink){
    const ctx = getAudioCtx();
    const notes = CHORDS[kind] || CHORDS.temperature;
    const waveform = state[kind].alert.waveform || 'sine';
    const count = Math.min(times, 12);
    for (let i = 0; i < count; i++){
      const delay = i * 0.72;
      notes.forEach((freq, ni) => {
        const t = ctx.currentTime + delay + ni * 0.11;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = waveform;                       // <-- configurable, not always 'sine'
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        osc.start(t); osc.stop(t + 1.8);
        sink.push(osc);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.type = waveform;
        osc2.frequency.setValueAtTime(freq * 2.756, t);
        gain2.gain.setValueAtTime(0, t);
        gain2.gain.linearRampToValueAtTime(0.05, t + 0.01);
        gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        osc2.start(t); osc2.stop(t + 1.0);
        sink.push(osc2);
      });
    }
  }

  let chimeMasterOn = true;

  function startChime(kind){
    const st = state[kind];
    if (st.alert.ringing) return;
    if (!chimeMasterOn) return; // stay silent, card still shows the ALERT pill
    st.alert.ringing = true;
    const cs = { timeoutIds: [], activeNodes: [], startTime: Date.now() };
    st.chimeState = cs;

    (function ringCycle(){
      if (!st.alert.ringing) return;
      const durationMs = Math.max(1, st.alert.ringMinutes) * 60000;
      if (Date.now() - cs.startTime >= durationMs){ stopChime(kind); return; }
      playChime(kind, 1, cs.activeNodes);
      cs.timeoutIds.push(setTimeout(ringCycle, 3000));
    })();
  }

  function stopChime(kind){
    const st = state[kind];
    st.alert.ringing = false;
    const cs = st.chimeState;
    if (cs){
      cs.timeoutIds.forEach(clearTimeout);
      cs.activeNodes.forEach(node => { try{ node.stop(0); }catch(e){} });
    }
    st.chimeState = null;
  }

  /* ============ Metric state ============ */
  const state = {
    temperature: {
      color:'#FF8A5B', min:16, max:32, volatility:0.15,
      history:[], current:22, baseline:null,
      alert:{ enabled:true, direction:'rising', target:28, waveform:'sine', ringMinutes:3, ringing:false },
      chimeState:null
    },
    humidity: {
      color:'#4FC3E8', min:25, max:75, volatility:0.4,
      history:[], current:45, baseline:null,
      alert:{ enabled:true, direction:'rising', target:65, waveform:'triangle', ringMinutes:3, ringing:false },
      chimeState:null
    }
  };

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function stepValue(prev, cfg){ return clamp(prev + (Math.random()-0.5) * cfg.volatility * 2, cfg.min, cfg.max); }

  function backfill(kind, startValue){
    const st = state[kind];
    const dayStart = new Date(); dayStart.setHours(0,0,0,0);
    const now = Date.now();
    const stepMs = 5 * 60 * 1000;
    let v = startValue;
    let t = dayStart.getTime();
    st.history = [];
    while (t <= now){
      st.history.push({ t, v });
      v = stepValue(v, st);
      t += stepMs;
    }
    if (st.history.length === 0) st.history.push({ t: dayStart.getTime(), v: startValue });
    st.baseline = st.history[0].v;
    st.current = st.history[st.history.length - 1].v;
  }
  backfill('temperature', 21);
  backfill('humidity', 42);

  function pushReading(kind, value){
    const st = state[kind];
    st.current = value;
    st.history.push({ t: Date.now(), v: value });
    if (st.history.length > 500) st.history.shift();
    checkAlert(kind);
    render();
  }

  function simulateTick(){
    ['temperature','humidity'].forEach(kind => {
      const st = state[kind];
      st.current = stepValue(st.current, st);
      st.history.push({ t: Date.now(), v: st.current });
      if (st.history.length > 500) st.history.shift();
      checkAlert(kind);
    });
    render();
    updateClock();
  }

  /* ============ Alert evaluation ============ */
  function checkAlert(kind){
    const st = state[kind], a = st.alert;
    const pill = document.getElementById(kind+'-status');
    if (!a.enabled){
      pill.classList.remove('alert'); pill.textContent = 'DISABLED';
      if (st.alert.ringing) stopChime(kind);
      updateCardGlow();
      return;
    }
    const reached = a.direction === 'rising' ? st.current >= a.target : st.current <= a.target;
    if (reached){
      pill.classList.add('alert'); pill.textContent = 'ALERT';
      startChime(kind);
    } else {
      pill.classList.remove('alert'); pill.textContent = 'NORMAL';
      if (st.alert.ringing) stopChime(kind);
    }
    updateCardGlow();
  }

  function updateCardGlow(){
    const card = document.getElementById('combinedCard');
    const anyAlert = state.temperature.alert.enabled && state.temperature.alert.ringing !== undefined &&
      (document.getElementById('temperature-status').textContent === 'ALERT' ||
       document.getElementById('humidity-status').textContent === 'ALERT');
    card.classList.toggle('alerting', anyAlert);
  }

  /* ============ Combined dual-axis canvas chart ============ */
  function resizeCanvas(canvas){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, rect.width * dpr);
    canvas.height = Math.max(1, rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return { ctx, width: rect.width, height: rect.height };
  }

  function drawCombinedChart(){
    const canvas = document.getElementById('combined-canvas');
    const stT = state.temperature, stH = state.humidity;
    if (!canvas || stT.history.length === 0 || stH.history.length === 0) return;
    const { ctx, width, height } = resizeCanvas(canvas);
    const pad = { l:46, r:52, t:14, b:20 };
    const plotW = width - pad.l - pad.r;
    const plotH = height - pad.t - pad.b;

    ctx.clearRect(0,0,width,height);

    // shared time domain across both metrics
    const tStart = Math.min(stT.history[0].t, stH.history[0].t);
    const tEnd = Math.max(stT.history[stT.history.length-1].t, stH.history[stH.history.length-1].t, tStart + 1);
    const xFor = t => pad.l + ((t - tStart) / (tEnd - tStart)) * plotW;

    // independent value scale per metric (its own left/right axis)
    function scaleFor(st){
      const values = st.history.map(p => p.v);
      let minV = Math.min(...values, st.baseline, st.alert.target);
      let maxV = Math.max(...values, st.baseline, st.alert.target);
      if (maxV - minV < 1){ minV -= 1; maxV += 1; }
      const margin = (maxV - minV) * 0.12;
      minV -= margin; maxV += margin;
      return { minV, maxV, yFor: v => pad.t + (1 - (v - minV) / (maxV - minV)) * plotH };
    }
    const scaleT = scaleFor(stT);
    const scaleH = scaleFor(stH);

    // neutral grid (visual reference only, not tied to either scale's units)
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i=0;i<=4;i++){
      const y = pad.t + (plotH/4)*i;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(width-pad.r,y); ctx.stroke();
    }

    ctx.font = '10px "JetBrains Mono", monospace';
    // left axis (temperature)
    ctx.fillStyle = state.temperature.color;
    ctx.textAlign = 'right';
    ctx.fillText(scaleT.maxV.toFixed(1), pad.l - 6, pad.t + 8);
    ctx.fillText(scaleT.minV.toFixed(1), pad.l - 6, pad.t + plotH);
    // right axis (humidity)
    ctx.fillStyle = state.humidity.color;
    ctx.textAlign = 'left';
    ctx.fillText(scaleH.maxV.toFixed(1), width - pad.r + 6, pad.t + 8);
    ctx.fillText(scaleH.minV.toFixed(1), width - pad.r + 6, pad.t + plotH);

    // x-axis time labels
    ctx.fillStyle = '#8FA0B3';
    ctx.textAlign = 'left';
    ctx.fillText('00:00', pad.l, height - 5);
    ctx.textAlign = 'right';
    ctx.fillText('now', width - pad.r, height - 5);

    function drawMetric(st, scale, labelSide){
      // dashed 00:00 baseline, on this metric's own axis
      const baseY = scale.yFor(st.baseline);
      ctx.save();
      ctx.setLineDash([5,4]);
      ctx.strokeStyle = st.color; ctx.globalAlpha = 0.5; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(pad.l, baseY); ctx.lineTo(width - pad.r, baseY); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = st.color; ctx.globalAlpha = 0.8;
      ctx.font = '9.5px "JetBrains Mono", monospace';
      ctx.textAlign = labelSide === 'left' ? 'left' : 'right';
      const lx = labelSide === 'left' ? pad.l + 4 : width - pad.r - 4;
      ctx.fillText('00:00 ' + st.baseline.toFixed(1), lx, baseY - 4);
      ctx.globalAlpha = 1;

      // dotted target line, on this metric's own axis
      const targetY = scale.yFor(st.alert.target);
      ctx.save();
      ctx.setLineDash([2,3]);
      ctx.strokeStyle = st.alert.ringing ? '#FF4757' : st.color;
      ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(pad.l, targetY); ctx.lineTo(width - pad.r, targetY); ctx.stroke();
      ctx.restore();

      // trace
      ctx.save();
      ctx.strokeStyle = st.color; ctx.lineWidth = 2;
      ctx.shadowColor = st.color; ctx.shadowBlur = 8;
      ctx.beginPath();
      st.history.forEach((p,i) => {
        const x = xFor(p.t), y = scale.yFor(p.v);
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      ctx.restore();

      // current point
      const last = st.history[st.history.length-1];
      ctx.beginPath();
      ctx.fillStyle = st.alert.ringing ? '#FF4757' : st.color;
      ctx.arc(xFor(last.t), scale.yFor(last.v), 3.5, 0, Math.PI*2);
      ctx.fill();
    }

    drawMetric(stT, scaleT, 'left');
    drawMetric(stH, scaleH, 'right');
  }

  /* ============ Gauges + numeric readouts ============ */
  function renderMetricReadout(kind){
    const st = state[kind], a = st.alert;
    document.getElementById(kind+'-value').textContent = st.current.toFixed(1);

    let progress;
    if (a.target === st.baseline){ progress = 0; }
    else if (a.direction === 'rising'){ progress = (st.current - st.baseline) / (a.target - st.baseline); }
    else { progress = (st.baseline - st.current) / (st.baseline - a.target); }
    progress = clamp(progress, 0, 1) * 100;

    document.getElementById(kind+'-gauge-fill').style.width = progress.toFixed(0) + '%';
    document.getElementById(kind+'-gauge-text').textContent = progress.toFixed(0) + '%';
    document.getElementById(kind+'-base-label').textContent = '00:00 基準溫度 ' + st.baseline.toFixed(1);
    document.getElementById(kind+'-target-label').textContent =
      '警示值 ' + (a.direction==='rising' ? '≥ ' : '≤ ') + a.target.toFixed(1) + (a.enabled ? '' : ' (off)');
  }

  function render(){
    renderMetricReadout('temperature');
    renderMetricReadout('humidity');
    drawCombinedChart();
  }

  /* ============ Clock ============ */
  function updateClock(){
    document.getElementById('clockText').textContent = new Date().toLocaleTimeString();
  }

  /* ============ Wire up settings panel ============ */
  ['temperature','humidity'].forEach(kind => {
    const a = state[kind].alert;
    const $ = id => document.getElementById(kind+'-'+id);

    $('enabled').checked = a.enabled;
    $('direction').value = a.direction;
    $('target').value = a.target;
    $('wave').value = a.waveform;
    $('duration').value = a.ringMinutes;

    $('enabled').addEventListener('change', e => { a.enabled = e.target.checked; checkAlert(kind); render(); });
    $('direction').addEventListener('change', e => { a.direction = e.target.value; checkAlert(kind); render(); });
    $('target').addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)){ a.target = v; checkAlert(kind); render(); }
    });
    $('wave').addEventListener('change', e => { a.waveform = e.target.value; }); // osc.type per metric — see playChime()
    $('duration').addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v) && v > 0) a.ringMinutes = v;
    });
  });

  document.getElementById('alertSettingsBtn').addEventListener('click', () => {
    document.getElementById('alertPanel').classList.toggle('hidden');
  });
  document.getElementById('closePanel').addEventListener('click', () => {
    document.getElementById('alertPanel').classList.add('hidden');
  });

  /* ============ Chime master switch ============ */
  const chimeBtn = document.getElementById('chimeToggleBtn');
  chimeBtn.addEventListener('click', () => {
    chimeMasterOn = !chimeMasterOn;
    chimeBtn.textContent = chimeMasterOn ? '🔔 警鈴開啟' : '🔕 警鈴關閉';
    chimeBtn.classList.toggle('off', !chimeMasterOn);

    if (!chimeMasterOn){
      Object.keys(state).forEach(kind => { if (state[kind].alert.ringing) stopChime(kind); });
    } else {
      getAudioCtx();
      Object.keys(state).forEach(kind => {
        const st = state[kind], a = st.alert;
        const reached = a.direction === 'rising' ? st.current >= a.target : st.current <= a.target;
        if (a.enabled && reached) startChime(kind);
      });
    }
  });

  /* ============ Boot ============ */
  render(); updateClock();
  window.addEventListener('resize', drawCombinedChart);
  setInterval(simulateTick, 3000);

  window.pushReading = pushReading;
})();
</script>
</body>
</html>
